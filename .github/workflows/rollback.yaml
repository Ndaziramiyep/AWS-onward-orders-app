# Manual rollback to an image that was already built: Actions tab -> rollback -> Run workflow (on main).
# Runs scripts/rollback.sh, which re-tags the old image as "latest" with that commit's deploy bundle,
# then waits for the blue/green release like build-push does. Revert the bad commit on main as well,
# or the next push ships it again.
name: rollback

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA to roll back to (must have been shipped by build-push)
        required: true

permissions:
  id-token: write # OIDC login to AWS
  contents: read

# Same group as build-push: a rollback never runs at the same time as a release.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main' # The AWS role only trusts the main branch
    runs-on: ubuntu-latest
    timeout-minutes: 55 # Canary + bake + rollback window, inside the 1-hour role session
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The target commit's deploy files are read from git history

      - uses: ./.github/actions/aws-login
        with:
          session-name: gha-rollback-${{ github.run_id }}

      - name: Roll back and wait for CodePipeline and CodeDeploy
        env:
          TARGET_COMMIT: ${{ inputs.commit }}
        run: ./scripts/rollback.sh "$TARGET_COMMIT" --yes
