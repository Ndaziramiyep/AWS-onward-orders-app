# CI/CD for the app.
# - Pull requests: unit tests only (no AWS access).
# - Push to main: tests -> build and push the image to ECR -> wait for the AWS release (release.yml).
#   Pushing the ":latest" tag starts EventBridge -> CodePipeline -> CodeDeploy blue/green, and the
#   release job stays running until that finishes, so a green check means every user is on the new version.
# AWS login is OIDC: GitHub issues a short-lived token that AWS exchanges for temporary credentials,
# so no AWS keys are stored in this repository or in GitHub secrets. Other settings: scripts/config.sh.
name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: # Manual run on main, e.g. the first image of a rebuild

permissions:
  id-token: write # OIDC login to AWS
  contents: read

# One release at a time; never cancel a release half way through. rollback.yml uses the same group.
# The called release workflow has no concurrency of its own: sharing this group would deadlock it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Same version as the image
      - run: pip install -r app/requirements.txt pytest
      - run: pytest -q

  build-push:
    needs: test
    # The AWS role only trusts the main branch; pull requests stop after the tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::648637468459:role/onward-orders-lab-github-actions-role # Output of the 01-foundation stack; not a secret
          aws-region: eu-west-1 # Exported as AWS_REGION, which scripts/config.sh reads
          role-session-name: gha-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: ./scripts/build-push.sh

  release:
    needs: build-push
    uses: ./.github/workflows/release.yml
    with:
      image_digest: ${{ needs.build-push.outputs.image_digest }}
