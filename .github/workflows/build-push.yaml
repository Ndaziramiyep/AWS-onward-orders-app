# Test -> build and push the image to ECR -> wait until AWS has released it.
# Pull requests only run the tests. A push to main ships: pushing the ":latest" tag starts
# EventBridge -> CodePipeline -> CodeDeploy blue/green, and the "release" job stays running
# until that finishes, so a green check means every user is on the new version.
name: build-and-push

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # Manual run on main, e.g. the first image of a rebuild

# OIDC: GitHub issues a short-lived token that AWS exchanges for temporary credentials.
# No AWS keys are stored anywhere in this repository or in GitHub secrets.
permissions:
  id-token: write
  contents: read

# One release at a time; never cancel a release half way through.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ROLE_ARN: arn:aws:iam::648637468459:role/onward-orders-lab-github-actions-role # Output of the 01-foundation stack; not a secret
  ECR_REPOSITORY: onward-orders-lab
  PIPELINE_NAME: onward-orders-lab-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Same version as the image
      - run: pip install -r app/requirements.txt pytest
      - run: pytest -q

  build-push:
    needs: test
    if: github.event_name != 'pull_request' # The AWS role only trusts the main branch anyway
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: ./scripts/build-push.sh

  release:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 55 # Canary + bake + rollback window, inside the 1-hour role session
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-release-${{ github.run_id }}

      - name: Wait for CodePipeline and CodeDeploy
        env:
          IMAGE_DIGEST: ${{ needs.build-push.outputs.image_digest }}
        run: ./scripts/wait-for-release.sh
