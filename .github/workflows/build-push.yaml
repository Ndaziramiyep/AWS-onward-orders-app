# Ships main: tests (test.yaml) -> build and push the image to ECR -> wait for the AWS release (release.yaml).
# Pushing the ":latest" tag starts EventBridge -> CodePipeline -> CodeDeploy blue/green, and the
# release job stays running until that finishes, so a green check means every user is on the new version.
# Pull requests are tested by test.yaml on its own. Settings: scripts/config.sh and .github/actions/aws-login.
name: build-and-push

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual run on main, e.g. the first image of a rebuild

permissions:
  id-token: write # OIDC login to AWS
  contents: read

# One release at a time; never cancel a release half way through. rollback.yaml uses the same group.
# The called workflows have no concurrency of their own: sharing this group would deadlock them.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  build-push:
    needs: test
    if: github.ref == 'refs/heads/main' # The AWS role only trusts the main branch
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/aws-login
        with:
          session-name: gha-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: ./scripts/build-push.sh

  release:
    needs: build-push
    uses: ./.github/workflows/release.yaml
    with:
      image_digest: ${{ needs.build-push.outputs.image_digest }}
