# Read by CodeDeploy (through the pipeline's CodeDeployToECS action) for every blue/green release.
version: 0.0
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: <TASK_DEFINITION> # The pipeline replaces this with the new task definition revision
        LoadBalancerInfo:
          ContainerName: "app" # Must match the container name in taskdef.yaml
          ContainerPort: 8080
        PlatformVersion: "LATEST"
